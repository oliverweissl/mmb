image:
  backend: vqgan_codebook
  n_candidates: 16383
  cone_filter:
    enabled: false
    alpha_deg: 20.0
    target_m: 10
text:
  spacy_model: en_core_web_sm
  composite:
    profile: minimal
optimizer:
  algorithm: random
  sampling:
    mode: sparse_multitier
    zero_anchor_fraction: 0.05
    tiers:
    - p_active: 0.005
      fraction: 0.2
    - p_active: 0.03
      fraction: 0.2
    - p_active: 0.1
      fraction: 0.25
    - p_active: 0.3
      fraction: 0.2
    - p_active: 0.5
      fraction: 0.1
  early_stop:
