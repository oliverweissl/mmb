      template: '{slot}'
      fillers:
      - snake
      - musical instrument
      pair:
      - snake
      - musical instrument
      meta:
        level_anchor: 1
        level_target: 2
        anchor_class_concrete: boa constrictor
        target_class_concrete: marimba
        anchor_label_in_prompt: snake
        target_label_in_prompt: musical instrument
        common_ancestor_level: null
        seed_idx_in_class: 2
        anchor_position: 3
        target_position: 5
        task: imagenet
        cell_key: boa constrictor|marimba|La1-Lt2|p2
        protect_words:
        - subject
        - image
