name: PILOT_internvl_a1_random_tiered
device: cuda
save_dir: runs/PILOT/imagenet/internvl/a1_random_tiered/s0
cache_dirs:
- ~/.cache/imagenet
categories:
- junco
- ostrich
- green iguana
- boa constrictor
- cello
- marimba
generations: 50
pop_size: 30
seed: 0
sut:
  model_id: OpenGVLab/InternVL3_5-4B-HF
  backend: torch
  batched_scoring: true
  batch_chunk: 15
seeds:
