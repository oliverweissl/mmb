name: CALIB_r3t_imagenet_ministral_a6_text_only_s0
device: cuda
save_dir: runs/CALIB/r3t/imagenet/ministral/a6_text_only/s0
cache_dirs:
- ~/.cache/imagenet
categories:
- junco
- ostrich
- green iguana
- boa constrictor
- cello
- marimba
generations: 50
pop_size: 30
seed: 0
sut:
  model_id: mistralai/Ministral-3-3B-Instruct-2512
  backend: torch
  batched_scoring: true
  batch_chunk: 15
seeds:
  mode: slot_items
  slot_items:
    items:
    - image: ~/data/cells/imagenet/marimba_01.png
      prompt: What is the main subject in this image?
      template: '{slot}'
      fillers:
      - marimba
      - bird
      pair:
      - marimba
      - bird
      meta:
        level_anchor: 0
        level_target: 2
        anchor_class_concrete: marimba
        target_class_concrete: ostrich
        anchor_label_in_prompt: marimba
        target_label_in_prompt: bird
        common_ancestor_level: null
        seed_idx_in_class: 1
        anchor_position: 5
        target_position: 1
        task: imagenet
        cell_key: marimba|ostrich|La0-Lt2|p1
        cell_idx: 0
        anchor_g_by_sut:
          llava_hf_llava_v1_6_mistral_7b_hf: 19.028114080429077
          mistralai_ministral_3_3b_instruct_2512: 5.932020127773285
          opengvlab_internvl3_5_4b_hf: 15.697633981704712
          qwen_qwen3_5_4b: 4.210798528045416
        protect_words:
        - subject
        - image
        calibration_holdout: true
    - image: ~/data/cells/imagenet/cello_01.png
      prompt: What is the main subject in this image?
      template: '{slot}'
      fillers:
      - string instrument
      - bird
      pair:
      - string instrument
      - bird
      meta:
        level_anchor: 1
        level_target: 2
        anchor_class_concrete: cello
        target_class_concrete: ostrich
        anchor_label_in_prompt: string instrument
        target_label_in_prompt: bird
        common_ancestor_level: null
        seed_idx_in_class: 1
        anchor_position: 4
        target_position: 1
        task: imagenet
        cell_key: cello|ostrich|La1-Lt2|p1
        cell_idx: 1
        anchor_g_by_sut:
          llava_hf_llava_v1_6_mistral_7b_hf: 23.519627571105957
          mistralai_ministral_3_3b_instruct_2512: 17.00541694276035
          opengvlab_internvl3_5_4b_hf: 21.447261095046997
          qwen_qwen3_5_4b: 5.314987612422556
        protect_words:
        - subject
        - image
        calibration_holdout: true
    - image: ~/data/cells/imagenet/junco_00.png
      prompt: What is the main subject in this image?
      template: '{slot}'
      fillers:
      - bird
      - lizard
      pair:
      - bird
      - lizard
      meta:
        level_anchor: 2
        level_target: 1
        anchor_class_concrete: junco
        target_class_concrete: green iguana
        anchor_label_in_prompt: bird
        target_label_in_prompt: lizard
        common_ancestor_level: null
        seed_idx_in_class: 0
        anchor_position: 0
        target_position: 2
        task: imagenet
        cell_key: junco|green iguana|La2-Lt1|p0
        cell_idx: 2
        anchor_g_by_sut:
          llava_hf_llava_v1_6_mistral_7b_hf: 6.1284403800964355
          mistralai_ministral_3_3b_instruct_2512: 8.542620651423931
          opengvlab_internvl3_5_4b_hf: 5.252624034881592
          qwen_qwen3_5_4b: 4.515597245772369
        protect_words:
        - subject
        - image
        calibration_holdout: true
    - image: ~/data/cells/imagenet/green_iguana_00.png
      prompt: What is the main subject in this image?
      template: '{slot}'
      fillers:
      - reptile
      - bird
      pair:
      - reptile
      - bird
      meta:
        level_anchor: 2
        level_target: 2
        anchor_class_concrete: green iguana
        target_class_concrete: ostrich
        anchor_label_in_prompt: reptile
        target_label_in_prompt: bird
        common_ancestor_level: null
        seed_idx_in_class: 0
        anchor_position: 2
        target_position: 1
        task: imagenet
        cell_key: green iguana|ostrich|La2-Lt2|p0
        cell_idx: 3
        anchor_g_by_sut:
          llava_hf_llava_v1_6_mistral_7b_hf: 15.42094111442566
          mistralai_ministral_3_3b_instruct_2512: 13.59244491159916
          opengvlab_internvl3_5_4b_hf: 18.085261702537537
          qwen_qwen3_5_4b: 5.1760445246472955
        protect_words:
        - subject
        - image
        calibration_holdout: true
image:
  backend: vqgan_codebook
  region_block: 0
  n_candidates: 16383
  cone_filter:
    enabled: false
    alpha_deg: 20.0
    target_m: 10
text:
  spacy_model: en_core_web_sm
  composite:
    operators:
    - name: synonym
      severity: 0.5
      k_max: 3
    - name: character_noise
      severity: 0.75
      modes:
      - homoglyph
      - zero_width
    - name: saliency
      severity: 0.25
      k_max: 1
      all_words: true
      min_word_len: 4
optimizer:
  algorithm: mmba
  sampling:
    mode: sparse_multitier
    zero_anchor_fraction: 0.05
    tiers:
    - p_active: 0.005
      fraction: 0.2
    - p_active: 0.03
      fraction: 0.2
    - p_active: 0.1
      fraction: 0.25
    - p_active: 0.3
      fraction: 0.2
    - p_active: 0.5
      fraction: 0.1
  early_stop:
    enable: false
  proximity_only: true
tags:
  exp_id: CALIB_r3t
  task: imagenet
  sut: ministral
  arm: a6_text_only
modality: text_only
