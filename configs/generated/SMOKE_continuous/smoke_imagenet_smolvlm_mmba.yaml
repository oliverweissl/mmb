name: SMOKE_continuous_imagenet_smolvlm_mmba
device: cuda
save_dir: runs/SMOKE/continuous/imagenet/smolvlm/mmba
cache_dirs:
- ~/.cache/imagenet
categories:
- junco
- ostrich
- green iguana
- boa constrictor
- cello
- marimba
generations: 20
pop_size: 10
seed: 0
sut:
  model_id: HuggingFaceTB/SmolVLM-256M-Instruct
  backend: torch
  batched_scoring: true
  batch_chunk: 10
seeds:
  mode: slot_items
  slot_items:
    items:
    - image: ~/data/cells/imagenet/junco_00.png
      prompt: What is the main subject in this image?
      template: '{slot}'
      fillers:
      - bird
      - lizard
      pair:
      - bird
      - lizard
      meta:
        level_anchor: 2
        level_target: 1
        anchor_class_concrete: junco
        target_class_concrete: green iguana
        anchor_label_in_prompt: bird
        target_label_in_prompt: lizard
        common_ancestor_level: null
        seed_idx_in_class: 0
        anchor_position: 0
        target_position: 2
        task: imagenet
        cell_key: junco|green iguana|La2-Lt1|p0
        cell_idx: 2
        anchor_g_by_sut:
          llava_hf_llava_v1_6_mistral_7b_hf: 6.1284403800964355
          mistralai_ministral_3_3b_instruct_2512: 8.542620651423931
          opengvlab_internvl3_5_4b_hf: 5.252624034881592
          qwen_qwen3_5_4b: 4.515597245772369
        protect_words:
        - subject
        - image
        calibration_holdout: true
image:
  backend: vqgan_latent
  preset: f8-16384
  resolution: 256
  decode_batch_size: 8
  latent:
    basis: dct
    d: 16
    m_max: 0.2
    w_img: 1.0
text:
  spacy_model: en_core_web_sm
  composite:
    profile: question_pool_only
optimizer:
  algorithm: mmba
  sampling:
    mode: stratified_magnitude
    r_min: 0.02
    r_max: 1.0
    power: 2.0
  crossover:
    prob: 0.9
    eta: 15.0
  mutation:
    prob: null
    eta: 20.0
  mmba:
    eps: 0.001
    tau: 0.0
  early_stop:
    enable: false
  proximity_only: true
tags:
  exp_id: SMOKE_continuous
  task: imagenet
  sut: smolvlm
  arm: a0_directed
