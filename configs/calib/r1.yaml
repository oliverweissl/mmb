round: r1
# image: live-codeword L2 KNN, 4x4-code regions (64), ladder to rank 128 (realistic in the ladder demo)
image: {knn_metric: l2_live, region_block: 4, region_levels: [1, 2, 4, 8, 16, 32, 64, 128]}
# text: stronger than MAIN 'minimal' (synonym k3, char-noise k2 [homoglyph, zero-width], typo k2): synonym pool 5,
# fragmentation added, up to 3 changed characters / typos per word, typos also on function words (all_words);
# protected words (ImageNet: subject, image; POPE: object noun, image) never edited
text:
  operators:
    - {name: synonym, severity: 0.5, k_max: 5}
    - {name: fragmentation, severity: 0.25}
    - {name: character_noise, severity: 0.5, modes: [homoglyph, zero_width]}
    - {name: saliency, severity: 0.5, all_words: true, min_word_len: 3}
