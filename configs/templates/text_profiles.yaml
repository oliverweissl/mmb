# Text profiles (2026-11-28 trim): the run-time text manipulator is the continuous question_pool operator.
#   question_pool_only  two float genes (t, u) over the validated whole-question pool configs/text/question_pool.json
#                       (scripts/build_question_pool.py). w_txt = text weight (calibration); d_max / n_bands default
#                       to the pool's meta.
#   noop                no text operator; set by mmb/config.py for modality image_only (text_dim = 0).
profiles:
  question_pool_only:
    operators:
      - {name: question_pool, severity: 1.0, w_txt: 1.0}
  noop:
    operators: []
