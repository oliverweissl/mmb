device: mps
save_dir: runs
cache_dirs:
- ~/.cache/imagenet
- /Volumes/SanDisk/Cache/imagenet
text:
  spacy_model: en_core_web_sm
  composite:
    profile: full_stack
optimizer:
  method: M0
  sampling:
    mode: uniform
    zero_anchor_fraction: 0.05
    tiers:
    - p_active: 0.005
      fraction: 0.2
    - p_active: 0.03
      fraction: 0.2
    - p_active: 0.1
      fraction: 0.25
    - p_active: 0.3
      fraction: 0.2
    - p_active: 0.5
      fraction: 0.1
  early_stop:
    enable: true
    epsilon_margin: 1.0e-30
    plateau_patience: 30
    no_improvement_warmup: 20
    hypervolume_reference: null
  algorithm: random
name: exp_a2_random_uniform
