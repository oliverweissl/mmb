# E1 base config (shared by all arms). See EXP_SETUP.md.
name: e1_base
device: cuda
save_dir: runs/E1
cache_dirs:
  - ~/.cache/imagenet
categories: [junco, ostrich, green iguana, boa constrictor, cello, marimba]
generations: 30          # 30 x 50 = 1,500 SUT evaluations per run (equal budget for every arm)
pop_size: 50
seed: 0                  # overridden per run (paired across arms)
sut:
  model_id: Qwen/Qwen3.5-4B   # placeholder; make_matrix.py replaces the sut block per SUT
  backend: torch
  batched_scoring: false # canonical scoring (C2 decision 2026-11-28)
seeds:
  mode: roster
  roster:
    class_list: [junco, ostrich, green iguana, boa constrictor, cello, marimba]
    seeds_per_class: 3
    min_anchor_confidence: 3.5
    abstraction:
      levels_anchor: [0, 1, 2]
      levels_target: [0, 1, 2]
      apply_disjointness: true
      directions: both
image:                   # continuous design (2026-11-28), see configs/templates/continuous_template.yaml
  backend: vqgan_latent
  preset: f8-16384
  decode_batch_size: 1     # canonical: every image decoded alone (docs/DETERMINISM_2026-11-28.md)
  latent: {basis: dct, d: 16, m_max: 0.2, w_img: 1.0}
text:
  spacy_model: en_core_web_sm
  composite:
    profile: question_pool_only
    overrides:
      question_pool: {w_txt: 1.0}   # text weight (calibration knob, applied by the manipulator)
optimizer:
  algorithm: mmba          # overridden per arm (scripts/make_arm_configs.py)
  sampling:
    mode: stratified_magnitude
  crossover: {prob: 0.9, eta: 15.0}
  mutation: {prob: null, eta: 20.0}
  mmba: {eps: 0.001, tau: 0.0}
