# E1 base config (shared by all arms). See EXP_SETUP.md.
name: e1_base
device: cuda
save_dir: runs/E1
cache_dirs:
  - ~/.cache/imagenet
categories: [junco, ostrich, green iguana, boa constrictor, cello, marimba]
generations: 50          # 50 x 30 = 1,500 SUT evaluations per run (equal budget for every arm)
pop_size: 30
seed: 0                  # overridden per run (paired across arms)
sut:
  model_id: llava-hf/llava-v1.6-mistral-7b-hf
  backend: torch
  load_in_8bit: true     # closest to the thesis' OpenVINO INT8 LLaVA-NeXT
seeds:
  mode: roster
  roster:
    class_list: [junco, ostrich, green iguana, boa constrictor, cello, marimba]
    seeds_per_class: 3
    min_anchor_confidence: 3.5
    abstraction:
      levels_anchor: [0, 1, 2]
      levels_target: [0, 1, 2]
      apply_disjointness: true
      directions: both
image:
  backend: vqgan_codebook
  n_candidates: 16383
  cone_filter:
    enabled: true
    alpha_deg: 20.0
    target_m: 10
text:
  spacy_model: en_core_web_sm
  composite:
    profile: minimal
optimizer:
  algorithm: agemoea2
  sampling:
    mode: sparse_multitier
    zero_anchor_fraction: 0.05
    tiers:
      - {p_active: 0.005, fraction: 0.20}
      - {p_active: 0.030, fraction: 0.20}
      - {p_active: 0.100, fraction: 0.25}
      - {p_active: 0.300, fraction: 0.20}
      - {p_active: 0.500, fraction: 0.10}
  early_stop:
    enable: false        # full budget for every arm, so budget curves are not truncated
